name: Desktop Release

on:
  pull_request:
    paths:
      - 'desktop/**'
      - 'scripts/release/prepare-desktop-release.ps1'
      - 'scripts/release/publish-desktop.py'
      - 'tests/desktop_release/**'
      - '.github/workflows/release-desktop.yml'
  push:
    branches: [main]
    tags:
      - 'desktop-v*.*.*'
    paths:
      - 'desktop/**'
      - 'scripts/release/prepare-desktop-release.ps1'
      - 'scripts/release/publish-desktop.py'
      - 'tests/desktop_release/**'
      - '.github/workflows/release-desktop.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: desktop-release-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/desktop-v') }}

jobs:
  verify:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.90.0'
          components: rustfmt, clippy
      - name: Install desktop dependencies
        working-directory: desktop
        run: npm ci
      - name: Test desktop UI and release publisher
        run: |
          npm --prefix desktop run check
          python -m unittest discover -s tests/desktop_release -p 'test_*.py'
      - name: Build local desktop assets
        run: npm --prefix desktop run frontend:build
      - name: Check Rust formatting and lints
        working-directory: desktop/src-tauri
        run: |
          cargo fmt --check
          cargo clippy --locked -- -D warnings

  build-signed:
    if: startsWith(github.ref, 'refs/tags/desktop-v')
    needs: verify
    runs-on: windows-latest
    timeout-minutes: 45
    outputs:
      version: ${{ steps.release.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Require a tag from main with a matching desktop version
        id: release
        shell: pwsh
        run: |
          git fetch origin main --no-tags
          git merge-base --is-ancestor $env:GITHUB_SHA origin/main
          if ($LASTEXITCODE -ne 0) {
            throw 'Desktop release tags must point to a commit contained in main.'
          }
          $tagVersion = $env:GITHUB_REF_NAME -replace '^desktop-v', ''
          $config = Get-Content -Raw desktop/src-tauri/tauri.conf.json | ConvertFrom-Json
          if ($tagVersion -ne [string]$config.version) {
            throw "Tag version $tagVersion does not match desktop version $($config.version)."
          }
          $package = Get-Content -Raw desktop/package.json | ConvertFrom-Json
          if ($tagVersion -ne [string]$package.version) {
            throw "Tag version $tagVersion does not match desktop package version $($package.version)."
          }
          $cargoVersion = Select-String -Path desktop/src-tauri/Cargo.toml -Pattern '^version = "([^"]+)"$' | Select-Object -First 1
          if ($null -eq $cargoVersion -or $tagVersion -ne $cargoVersion.Matches[0].Groups[1].Value) {
            throw "Tag version $tagVersion does not match the desktop Cargo package version."
          }
          "version=$tagVersion" >> $env:GITHUB_OUTPUT
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.90.0'
      - name: Require updater signing secrets
        shell: pwsh
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:TAURI_SIGNING_PRIVATE_KEY)) {
            throw 'Missing TAURI_SIGNING_PRIVATE_KEY GitHub Actions secret.'
          }
          if ([string]::IsNullOrWhiteSpace($env:TAURI_SIGNING_PRIVATE_KEY_PASSWORD)) {
            throw 'Missing TAURI_SIGNING_PRIVATE_KEY_PASSWORD GitHub Actions secret.'
          }
      - name: Build and updater-sign the NSIS installer
        working-directory: desktop
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          npm ci
          npm run build
      - name: Stage and validate the desktop release
        shell: pwsh
        run: |
          ./scripts/release/prepare-desktop-release.ps1
          python scripts/release/publish-desktop.py --stage "build/desktop-release/${{ steps.release.outputs.version }}" --validate-only
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-release-${{ github.sha }}
          path: build/desktop-release/${{ steps.release.outputs.version }}/
          if-no-files-found: error
          retention-days: 14

  publish:
    if: startsWith(github.ref, 'refs/tags/desktop-v')
    needs: build-signed
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: release-r2
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: desktop-release-${{ github.sha }}
          path: build/desktop-release/${{ needs.build-signed.outputs.version }}
      - name: Install R2 publication dependency
        run: python3 -m pip install --disable-pip-version-check boto3
      - name: Publish and verify the signed desktop update
        env:
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          R2_PUBLIC_URL: ${{ secrets.R2_PUBLIC_URL }}
        run: python3 scripts/release/publish-desktop.py --stage "build/desktop-release/${{ needs.build-signed.outputs.version }}"
